  <line x1="38" y1="24" x2="50" y2="34" stroke-width="2" />
  <line x1="62" y1="24" x2="50" y2="34" stroke-width="2" />
  <!-- Aisladores en cruz superiores -->
  <rect x="27" y="17" width="6" height="7" rx="1" fill="#111827" />
  <rect x="67" y="17" width="6" height="7" rx="1" fill="#111827" />
  <rect x="33" y="31" width="6" height="7" rx="1" fill="#111827" />
  <rect x="61" y="31" width="6" height="7" rx="1" fill="#111827" />
  <!-- Caja de protección / maniobra en el poste -->
  <rect x="54" y="52" width="16" height="22" rx="2" fill="white" stroke-width="2.5" />
  <circle cx="58" cy="63" r="1.5" fill="#111827" />
</svg>
