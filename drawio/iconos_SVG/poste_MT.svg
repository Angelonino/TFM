<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Poste vertical -->
  <line x1="50" y1="12" x2="50" y2="92" stroke-width="4" />
  <!-- Base suelo -->
  <line x1="40" y1="92" x2="60" y2="92" stroke-width="4" />
  <!-- Cruceta superior -->
  <line x1="24" y1="24" x2="76" y2="24" stroke-width="3" />
  <!-- Cruceta intermedia -->
  <line x1="30" y1="38" x2="70" y2="38" stroke-width="3" />
